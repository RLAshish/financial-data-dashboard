name: Validate analysis pipeline

on:
  push:
    branches: [main]
    paths-ignore:
      - "outputs/**"
      - "README.md"
  workflow_dispatch:

jobs:
  analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run analysis
        run: python src/analyze.py
      - name: Verify generated Excel report
        run: |
          test -s "$(find outputs -maxdepth 1 -name '*.xlsx' -print -quit)"
          ls -lh outputs/*.xlsx
